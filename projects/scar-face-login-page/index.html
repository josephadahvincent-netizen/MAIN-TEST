<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="main">
        <div class="container1">
            <img src=".//Screenshot from 2026-07-08 13-20-50.png" height="1000px" width="800px" >
        </div>
        <div class="container2">
            <h1>welcome to<br>
            <div class="design-school">Design school</div></h1>
            
            <div class="socials">
                <div class="input-card1">
                    <button type="button" class="button1">
                        <i class="fa-brands fa-google"></i>
                        login with google
                    </button><br>
                </div>
                <div class="input-card1">
                    <button type="button" class="button2">
                        <i class="fa-brands fa-facebook"></i>
                        login with facebook
                    </button>
                </div>
               
            </div>
            <div class="verification">
                <div class="field-card">
                    <div class="field-label-row">
                        <span>Email</span>
                    </div>
                    <div class="input-card2">
                        <i class="fa-solid fa-envelope"></i>
                        <div class="input-text">
                            <span class="input-title">Email</span>
                            <input type="email" name="E-mail" id="mail" placeholder="example@gmail.com">
                        </div>
                    </div>
                </div>

                <div class="field-card">
                    <div class="field-label-row">
                        <span>Password</span>
                    </div>
                    <div class="input-card2">
                        <i class="fa-solid fa-key"></i>
                        <div class="input-text">
                            <span class="input-title">Password</span>
                            <input type="password" name="password" id="security" placeholder="Enter your password">
                        </div>
                        <i class="fa-regular fa-eye toggle-eye"></i>
                    </div>
                </div>
            </div>
            <div class="main-help">
                <div class="help">
                    <input type="checkbox" name="tick" id="box">
                     <label>remember me</label>
                    </input>
                </div>
             <a href="#" id="assist" >forgot password?</a>
            </div>
                
            <div>
                <button type="submit" id="submit">login</button>
            </div>
            <p>don't have an account?<a href="#">register</a></p>
        </div>    
    </div>
</body>
</html>
